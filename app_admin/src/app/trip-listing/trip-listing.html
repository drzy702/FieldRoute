<div class="page-heading"><div><p class="eyebrow">TRIP MANAGEMENT</p><h1>Available trips</h1><p>Manage destinations, pricing, and getaway details.</p></div>
<div *ngIf="isLoggedIn()">
    <button (click)="addTrip()" class="btn btn-info">Add Trip</button>
</div>
</div>
<p *ngIf="loading" role="status">Loading trips…</p>
<p *ngIf="error" class="alert alert-danger" role="alert">{{ error }}</p>
<div class="filter-bar">
    <input type="search" aria-label="Search trips" placeholder="Search trips..." [(ngModel)]="searchText" (ngModelChange)="currentPage = 1" />

    <select aria-label="Filter by price" [(ngModel)]="priceFilter" (ngModelChange)="currentPage = 1">
        <option value="all">All Prices</option>
        <option value="1000">Under $1,000</option>
        <option value="2000">Under $2,000</option>
        <option value="3000">Under $3,000</option>
    </select>

    <select aria-label="Sort trips" [(ngModel)]="sortOption" (ngModelChange)="currentPage = 1">
        <option value="none">Sort By</option>
        <option value="priceLowHigh">Price: Low to High</option>
        <option value="priceHighLow">Price: High to Low</option>
        <option value="nameAZ">Name: A-Z</option>
    </select>

    <select aria-label="Filter by rating" [(ngModel)]="starFilter" (ngModelChange)="currentPage = 1">
        <option value="all">All Ratings</option>
        <option value="5">5 Stars</option>
        <option value="4">4 Stars</option>
        <option value="3">3 Stars</option>
        <option value="2">2 Stars</option>
        <option value="1">1 Star</option>
    </select>
</div>

<p class="results-count" *ngIf="!loading">{{ filteredTrips.length }} matching trips</p>
<div class="trip-grid">
    <div *ngFor="let trip of paginatedTrips" class="trip-grid-item">
        <app-trip-card [trip]="trip" (deleteTripEvent)="deleteTrip($event)">
        </app-trip-card>
    </div>
</div>
<p *ngIf="!loading && !error && !filteredTrips.length" class="admin-panel">No trips match your filters.</p>

<div class="pagination-controls">
  <button 
    class="btn btn-secondary"
    (click)="previousPage()"
    [disabled]="currentPage === 1">
    Previous
  </button>

  <span>
    Page {{ currentPage }} of {{ totalPages }}
  </span>

  <button 
    class="btn btn-secondary"
    (click)="nextPage()"
    [disabled]="currentPage >= totalPages">
    Next
  </button>
</div>
