<section class="admin-panel login-panel"><p class="eyebrow">TRAVLR ADMINISTRATION</p><h1>Admin login</h1><p>Sign in to manage your trips and website.</p>
  @if (formError()) { <p class="alert alert-danger" role="alert">{{ formError() }}</p> }
  <form (ngSubmit)="onLoginSubmit()">
    <label for="email">Email address</label><input id="email" type="email" name="email" [(ngModel)]="credentials.email" autocomplete="username" required>
    <label for="password">Password</label><input id="password" type="password" name="password" [(ngModel)]="credentials.password" autocomplete="current-password" required>
    <button type="submit" class="btn btn-primary" [disabled]="submitting()">{{ submitting() ? 'Signing in…' : 'Sign In' }}</button>
  </form>
</section>
